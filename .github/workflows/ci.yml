name: CI

on:
  push: { branches: [main] }
  pull_request:

jobs:
  all:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with: { bun-version: latest }
      - run: bun install
      - run: bun run --cwd observatory typecheck
      - run: bun run --cwd observatory test
      - run: bun run --cwd observatory manifest
      - run: bun run --cwd site typecheck
      - run: bun run --cwd site lint
      - run: bun run --cwd site test
      - run: bunx playwright install --with-deps chromium
        working-directory: site
      - run: bun run --cwd site fixtures
      - run: bun run --cwd site test:e2e
      - run: bun run --cwd site build
